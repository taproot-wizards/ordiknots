[package]
name = "tx_creator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tx_creator"
path = "src/main.rs"

[lib]
name = "tx_creator"
path = "src/lib.rs"

[dependencies]
bitcoin = "0.32"
bitcoincore-rpc = "0.19"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
