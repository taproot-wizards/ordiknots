[package]
name = "ordiknots"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ordiknots"
path = "src/main.rs"

[lib]
name = "ordiknots"
path = "src/lib.rs"

[dependencies]
bitcoin = "0.32"
bitcoin_hashes = "0.14"
bitcoincore-rpc = "0.19"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
rand = "0.8"
redb = "3.1"
strum = { version = "0.26", features = ["derive"] }
indicatif = "0.18.1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
base64 = "0.22"
