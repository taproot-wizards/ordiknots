version: "3.7"

services:
  mempool-web:
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: "mempool-api"
    image: mempool/frontend:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for mempool-db:3306 --timeout=720 -- nginx -g 'daemon off;'"
    ports:
      - 5000:8080
    depends_on:
      - mempool-api
    networks:
      - mempool-net

  mempool-api:
    environment:
      MEMPOOL_BACKEND: "none"
      MEMPOOL_NETWORK: "regtest"
      CORE_RPC_HOST: "bitcoind"
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: "mempool"
      CORE_RPC_PASSWORD: "mempool"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "mempool-db"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
    image: mempool/backend:latest
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for-it.sh mempool-db:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - mempool-data:/backend/cache
    depends_on:
      - mempool-db
    networks:
      - bitcoin-net
      - mempool-net

  mempool-db:
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "admin"
    image: mariadb:10.5.21
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - mempool-db-data:/var/lib/mysql
    networks:
      - mempool-net

networks:
  bitcoin-net:
    external: true
    name: bitcoin-regtest_bitcoin-net
  mempool-net:
    driver: bridge

volumes:
  mempool-data:
  mempool-db-data:
